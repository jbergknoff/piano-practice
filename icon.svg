    <rect x="116" y="156" width="280" height="200" rx="16" fill="#FFF7E5" />
    <path d="M156 161V351M196 161V351M236 161V351M276 161V351M316 161V351M356 161V351" />
  </g>
  <g fill="#2F2417">
