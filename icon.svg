<svg xmlns="http://www.w3.org/2000/svg" viewBox="103 103 306 306" width="306" height="306" role="img" aria-label="Piano Practice">
  <!-- Transparent background, so the favicon and the manifest's "any" icon sit
       on whatever the browser/launcher paints behind them. The viewBox is
       cropped to the keyboard art (plus a little padding) so it stays legible
       at 16px without a background tile to fill the square.
       icon-maskable.svg is the full-bleed variant for the "maskable" purpose,
       which requires an opaque background the platform can crop to any shape. -->
