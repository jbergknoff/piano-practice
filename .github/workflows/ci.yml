name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make pr-ready
      - run: git diff --exit-code
      - run: make down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: tests/integration/results/
          if-no-files-found: ignore
