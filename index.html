<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FAF1DD" />
    <title>Piano Practice</title>
    <!-- Installed on Android, the manifest's "orientation": "landscape" locks
         the app to landscape with no in-app control. Everywhere else, the
         fullscreen button does it (iOS honours neither). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- iOS composites a transparent icon onto black, so the home-screen icon
         uses the opaque full-bleed variant rather than the transparent favicon. -->
    <link rel="apple-touch-icon" href="icon-maskable.svg" />
    <link rel="preload" href="dist/geist-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-mono-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('dist/geist-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('dist/geist-500.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('dist/geist-600.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('dist/geist-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('dist/geist-mono-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('dist/geist-mono-500.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('dist/instrument-serif-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100%; height: 100%;
      }
      ::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Hidden form for Netlify build-time detection. Submissions are sent via fetch from DebugLogTab. -->
    <form name="debug-log" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="debug-log" />
      <textarea name="log"></textarea>
      <textarea name="explanation"></textarea>
    </form>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
