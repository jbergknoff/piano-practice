<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Piano Practice</title>
    <link rel="preload" href="dist/bravura.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/geist-mono-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="dist/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Bravura';
        src: url('dist/bravura.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'Geist';
        src: url('dist/geist-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('dist/geist-500.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('dist/geist-600.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('dist/geist-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('dist/geist-mono-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('dist/geist-mono-500.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('dist/instrument-serif-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100%; height: 100%;
      }
      ::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
